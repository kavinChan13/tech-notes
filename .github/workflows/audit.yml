name: Audit

# The audits were previously only ever run by hand, so a regression could sit
# on main until someone happened to notice a broken page. Gate every push and
# PR on them instead.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # build_sitemap.py reads commit dates for <lastmod>.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Search index loader behaviour
        run: node scripts/test_search_index_loader.mjs

      - name: Anchors & <details> integrity
        run: python scripts/audit_guides.py

      - name: Cross-file links & anchors
        run: python scripts/audit_links.py

      - name: Block-tag nesting
        run: python scripts/audit_html_nesting.py

      - name: Interview Q&A format (migrated dirs)
        run: python scripts/audit_interview_qa.py

      - name: Page shell (offline / theme / stylesheet order)
        run: python scripts/audit_page_shell.py

      - name: Article counters (home vs directory pages)
        run: python scripts/audit_counts.py

      - name: Reading-time labels (page vs directory card)
        run: python scripts/audit_read_time.py

      - name: Search index is current
        run: |
          python scripts/build_search_index.py
          git diff --exit-code --stat -- assets/search-index.js \
            || { echo "::error::assets/search-index.js is stale — run python scripts/build_search_index.py and commit the result"; exit 1; }

      # URL set only: <lastmod> is the date of a file's last commit, and
      # committing the sitemap is itself that commit, so a byte-for-byte gate
      # could never pass. See scripts/build_sitemap.py.
      - name: Sitemap covers every page
        run: python scripts/build_sitemap.py --check
