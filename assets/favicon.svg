  <path d="M18 15h20l10 10v24a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V18a3 3 0 0 1 3-3z" fill="#ffffff"/>
  <path d="M38 15l10 10H41a3 3 0 0 1-3-3z" fill="#bfdbfe"/>
  <g fill="#2563eb">
    <rect x="24" y="31" width="18" height="3" rx="1.5"/>
    <rect x="24" y="38" width="18" height="3" rx="1.5"/>
    <rect x="24" y="45" width="11" height="3" rx="1.5"/>
  </g>
</svg>
