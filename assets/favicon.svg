<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kavin Tech Notes">
  <!-- Stacked note pages with a bookmark: readable at 16px, and the fills are
       fixed rather than themed because a favicon is composited by the browser
       chrome, where CSS variables and data-theme do not reach. -->
