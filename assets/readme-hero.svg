<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Kavin Tech Notes hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f7ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-opacity="0.12"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#c7d2fe"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>

  <circle cx="1450" cy="120" r="160" fill="#dbeafe" opacity="0.55"/>
  <circle cx="220" cy="560" r="220" fill="#e0e7ff" opacity="0.42"/>
  <rect x="1408" y="392" width="144" height="120" fill="url(#dots)" opacity="0.5"/>

  <rect x="76" y="56" width="1448" height="72" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="112" y="101" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" fill="#111827" font-weight="700">Kavin <tspan fill="#2563eb">Tech Notes</tspan></text>
  <text x="1488" y="101" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#6b7280">C++ &#183; Systems &#183; AI &#183; Architecture</text>

  <text x="120" y="236" font-family="Inter, Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="66" fill="#111827" font-weight="780">&#35745;&#31639;&#26426;&#31185;&#23398;&#30693;&#35782;&#24211;</text>
  <text x="120" y="286" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" fill="#6b7280">Build deep knowledge, one topic at a time.</text>
  <rect x="120" y="306" width="120" height="6" rx="3" fill="url(#accent)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="356" width="1240" height="220" rx="20" fill="#ffffff" stroke="#e5e7eb"/>
  </g>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#374151">
    <rect x="160" y="408" width="164" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="188" y="437">C++ / STL</text>

    <rect x="344" y="408" width="224" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="372" y="437">AI Engineering</text>

    <rect x="588" y="408" width="152" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="616" y="437">Big Data</text>

    <rect x="760" y="408" width="200" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="788" y="437">Architecture</text>

    <rect x="980" y="408" width="116" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1008" y="437">Linux</text>

    <rect x="1116" y="408" width="200" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1144" y="437">Perf / Debug</text>
  </g>

  <rect x="160" y="488" width="270" height="48" rx="12" fill="url(#accent)"/>
  <text x="295" y="519" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="700">GitHub Pages</text>

  <text x="470" y="519" font-family="Inter, Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#4b5563">&#32431; HTML &#183; &#26080;&#38656;&#26500;&#24314; &#183; &#31163;&#32447;&#21487;&#35835;</text>
</svg>
